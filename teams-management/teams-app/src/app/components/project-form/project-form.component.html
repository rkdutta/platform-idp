<!-- src/app/components/project-form/project-form.component.html -->
<form [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="project-form">
  <div class="form-group">
    <label for="name">Project Name</label>
    <input
      type="text"
      id="name"
      formControlName="name"
      class="form-control"
      [class.invalid]="name?.invalid && name?.touched"
      placeholder="Enter project name"
    >
    <div class="error-message" *ngIf="name?.invalid && name?.touched">
      <span *ngIf="name?.errors?.['required']">Project name is required</span>
      <span *ngIf="name?.errors?.['minlength']">Project name must be at least 2 characters</span>
    </div>
  </div>

  <div class="error-message" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <button
    type="submit"
    class="btn btn-primary"
    [disabled]="projectForm.invalid || isSubmitting"
  >
    <span *ngIf="isSubmitting">Creating...</span>
    <span *ngIf="!isSubmitting">Create Project</span>
  </button>
</form>
